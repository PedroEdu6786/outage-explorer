name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install resolved dependencies and package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Architecture boundaries and negative fixtures
        run: pytest tests/architecture
      - name: Behavior and existing devlog tests
        run: pytest tests/unit tests/integration tests/test_devlog_hook.py
      - name: Build distribution
        run: python -m build --no-isolation
